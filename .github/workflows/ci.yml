name: Verify prototype

on:
  push:
    branches: [main, 'docs/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Verify behavior, example, and documentation links
        run: python scripts/verify.py
      - name: Verify isolated wheel installation
        run: python scripts/check_wheel.py
      - name: Check whitespace
        run: git show --format= --check HEAD

  rdf-parser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional parser (RDF export extra)
        run: python -m pip install . rdflib==7.1.4 pyparsing==3.3.3
      - name: Check JSON-LD parsing and Turtle graph round-trip
        run: python scripts/check_rdf.py
